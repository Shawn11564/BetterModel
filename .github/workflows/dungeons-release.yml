# Builds our BetterModel (the `dungeons` branch) and attaches the jars to a GitHub Release.
# Push a tag named <upstream release>-dungeons.<n>, e.g. 3.7.1-dungeons.1. See DUNGEONS.md.
# The dungeons project's runServer downloads the paper jar from that release (betterModelRelease).
name: Dungeons release

on:
  push:
    tags: [ "*-dungeons.*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build
        # The version comes from the tag, so gradle.properties (which upstream edits every
        # release) stays untouched on our branch.
        run: |
          chmod +x gradlew
          ./gradlew :platform:bettermodel-paper:shadowJar \
            :bettermodel-api:jar :bettermodel-api:bettermodel-bukkit-api:jar \
            -Pproject_version="$TAG" --stacktrace
      - name: Release
        shell: bash
        run: |
          set -euo pipefail
          paper="build/libs/bettermodel-$TAG-paper.jar"
          test -s "$paper"
          api=(api/build/libs/bettermodel-api-"$TAG".jar api/bukkit-api/build/libs/bettermodel-bukkit-api-"$TAG".jar)
          for f in "${api[@]}"; do test -s "$f"; done
          base="${TAG%-dungeons.*}"
          {
            echo "BetterModel $base with the dungeons changes on top."
            echo
            echo "Changes over upstream $base:"
            git log --no-merges --format='- %s' "$base..HEAD" -- . ':(exclude).github' ':(exclude)DUNGEONS.md' || true
          } > notes.md
          gh release create "$TAG" "$paper" "${api[@]}" --title "$TAG" --notes-file notes.md
