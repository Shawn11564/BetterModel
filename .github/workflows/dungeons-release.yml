# Builds our BetterModel (the `dungeons` branch) and attaches the jars to a GitHub Release.
# Push a tag named <project_version>-dungeons.<n>, e.g. 3.7.2-dungeons.1, where project_version is
# upstream's (gradle.properties) at the commit we're built on. See DUNGEONS.md.
# The dungeons project's runServer downloads the paper jar from that release (betterModelRelease).
name: Dungeons release

on:
  push:
    tags: [ "*-dungeons.*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM: https://github.com/toxicity188/BetterModel.git
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project_version=//p' gradle.properties | tr -d '\r')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$TAG" in
            "$version"-dungeons.*) ;;
            *) echo "::error::Tag '$TAG' must be '$version-dungeons.<n>' (project_version is $version)."; exit 1 ;;
          esac
      - name: Build
        # The version comes from the tag, so gradle.properties (which upstream edits every
        # release) stays untouched on our branch. The root build reads changelog/<version>.md
        # (for its Hangar page), so give our version upstream's changelog for this version.
        run: |
          chmod +x gradlew
          if [ -f "changelog/$VERSION.md" ]; then cp "changelog/$VERSION.md" "changelog/$TAG.md"; else touch "changelog/$TAG.md"; fi
          ./gradlew :platform:bettermodel-paper:shadowJar \
            :bettermodel-api:jar :bettermodel-api:bettermodel-bukkit-api:jar \
            -Pproject_version="$TAG" --stacktrace
      - name: Release
        shell: bash
        run: |
          set -euo pipefail
          paper="build/libs/bettermodel-$TAG-paper.jar"
          test -s "$paper"
          api=(api/build/libs/bettermodel-api-"$TAG".jar api/bukkit-api/build/libs/bettermodel-bukkit-api-"$TAG".jar)
          for f in "${api[@]}"; do test -s "$f"; done
          # The upstream commit we're built on: the newest one of upstream's v3 in our history.
          git fetch --quiet --tags "$UPSTREAM" v3
          base=$(git merge-base HEAD FETCH_HEAD)
          short=$(git rev-parse --short "$base")
          if release=$(git describe --tags --exact-match "$base" 2>/dev/null); then
            on="upstream release $release"
          else
            on="upstream v3 at $short ($VERSION in development, after $(git describe --tags --abbrev=0 "$base"))"
          fi
          {
            echo "BetterModel built on $on, with the dungeons changes on top."
            echo
            echo "Upstream commit: https://github.com/toxicity188/BetterModel/commit/$base"
            echo
            echo "Our changes:"
            changes=$(git log --no-merges --format='- %s' "$base..HEAD" -- . ':(exclude).github' ':(exclude)DUNGEONS.md')
            echo "${changes:-- none (upstream as-is)}"
          } > notes.md
          cat notes.md
          gh release create "$TAG" "$paper" "${api[@]}" --title "$TAG" --notes-file notes.md
